[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-swarm-ai"
version = "0.1.0"
description = "Local-first Python toolkit for parallel LLM and Claude agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ellmos-ai"}
]
keywords = [
  "llm",
  "multi-agent",
  "claude",
  "stigmergy",
  "consensus",
  "agent-orchestration",
  "python"
]
dependencies = [
  "anthropic>=0.40.0"
]

[project.optional-dependencies]
providers = ["coma @ git+https://github.com/dev-bricks/coma.git"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/swarm-ai"
Repository = "https://github.com/ellmos-ai/swarm-ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
