[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-swarm-ai"
version = "0.1.0"
description = "Local-first Python toolkit for parallel LLM and Claude agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "ellmos-ai"}
]
keywords = [
  "llm",
  "multi-agent",
  "claude",
  "stigmergy",
  "consensus",
  "agent-orchestration",
  "python"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "anthropic>=0.40.0"
]

[project.optional-dependencies]
providers = ["coma @ git+https://github.com/dev-bricks/coma.git"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/swarm-ai"
Documentation = "https://github.com/ellmos-ai/swarm-ai#readme"
Repository = "https://github.com/ellmos-ai/swarm-ai"
"Bug Tracker" = "https://github.com/ellmos-ai/swarm-ai/issues"
Changelog = "https://github.com/ellmos-ai/swarm-ai/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/swarm-ai/blob/master/SECURITY.md"

[project.scripts]
swarm-consensus = "tools.consensus_swarm:main"
swarm-benchmark = "tools.benchmark:main"
swarm-translate = "tools.translate_swarm:main"
swarm-summarize = "tools.summarize_chunks:main"
swarm-stigmergy-init = "tools.stigmergy_init:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
tools = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

